name: Release content-review

on:
  push:
    tags:
      - 'content-review/v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd content-review && npm ci && npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: content-review/dist/main.js
